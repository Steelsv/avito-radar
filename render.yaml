services:
  - type: web
    name: avito-radar
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MINI_APP_URL
        value: https://avito-radar.onrender.com/
    autoDeploy: true
